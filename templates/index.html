<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAG PDF Chatbot</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <h2>📚 RAG Chat</h2>
            <p>PDF Knowledge Assistant</p>
        </div>

        <div class="upload-card">

            <h3>Upload PDF</h3>

            <input
                id="pdfInput"
                type="file"
                accept=".pdf"
                multiple>

            <button id="uploadBtn">
                Upload
            </button>

        </div>

        <div class="document-list">

            <h3>Uploaded Documents</h3>

            <ul id="documentList">

            </ul>

        </div>

    </aside>

    <!-- Main -->

    <main class="main">

        <header>

            <h1>RAG PDF Chatbot</h1>

            <p>
                Ask questions from your uploaded documents.
            </p>

        </header>

        <section
            id="chatBox"
            class="chat-box">

            <div class="message ai">

                <div class="avatar">
                    🤖
                </div>

                <div class="bubble">

                    <h3>Assistant</h3>

                    <p>
                        Welcome!
                        Upload one or more PDFs and ask me anything.
                    </p>

                </div>

            </div>

        </section>

        <div
            id="typing"
            class="typing"
            style="display:none;">

            Thinking...

        </div>

        <section class="chat-input">

            <textarea
                id="question"
                rows="2"
                placeholder="Ask anything about your PDFs..."></textarea>

            <button id="sendBtn">
                Send
            </button>

        </section>

    </main>

</div>

<script src="/static/js/script.js"></script>

</body>
</html>
